# Dovecot Mesh settings for the Docker image, the same on every node.
# Include it at the end of dovecot.conf:
#
#   !include mesh.conf
#
# Change both secrets and list every node in a mesh_peer block. See
# src/mesh/README.md for what the settings do.

# --- Postfix on the host ---

# Postfix delivers over LMTP (virtual_transport = lmtp:inet:127.0.0.1:24):
# only Dovecot's own deliveries notify the mesh and wait for replication.
protocols {
  lmtp = yes
}
service lmtp {
  inet_listener lmtp {
    listen = 127.0.0.1
    port = 24
  }
}
# like a protocol lda block for dovecot-lda
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  lda_mailbox_autocreate = yes
  lda_mailbox_autosubscribe = yes
}

# SMTP AUTH (smtpd_sasl_path = inet:127.0.0.1:12346). This replaces a
# unix_listener in Postfix's spool directory, which is outside the
# container.
service auth {
  inet_listener auth-postfix {
    listen = 127.0.0.1
    port = 12346
    # mechanisms offered to Postfix's clients, if not auth_mechanisms
    #auth_mechanisms = PLAIN LOGIN
  }
}

# --- Mesh ---

mail_plugins {
  notify = yes
  mesh = yes
}
dsync_features = relay-changes reuse-local-mails

# dsync between nodes, through the doveadm servers
doveadm_port = 12345
doveadm_password = CHANGE-ME-same-on-all-nodes
service doveadm {
  inet_listener doveadm {
    port = 12345
  }
}

# Mesh HTTP API between nodes and the web UI (any user name, this as the
# password)
mesh_api_key = CHANGE-ME-same-on-all-nodes
service mesh {
  inet_listener mesh-http {
    port = 8090
  }
}

# One block per node, named after the node's hostname: with
# network_mode: host the container has the host's hostname, which is the
# node's default mesh_node_name. A node ignores the block with its own name.
mesh_peer mail1 {
  mesh_peer_host = 10.0.0.1
  mesh_peer_doveadm_port = 12345
  mesh_peer_http_port = 8090
}
mesh_peer mail2 {
  mesh_peer_host = 10.0.0.2
  mesh_peer_doveadm_port = 12345
  mesh_peer_http_port = 8090
}
mesh_peer mail3 {
  mesh_peer_host = 10.0.0.3
  mesh_peer_doveadm_port = 12345
  mesh_peer_http_port = 8090
}

# Check users' copies in the background and repair differences.
mesh_verify_interval = 1min
