# Dovecot Mesh on one node, next to Postfix on the host. The same file on
# every node, e.g. in /root/docker/mail/dovecotmesh/ with the mesh's state
# in data/ beside it. See docker/README.md.
#
# Pin the image in a .env file beside this one, e.g.
#   DOVECOTMESH_IMAGE=ghcr.io/fragtion/dovecotmesh:sha-0123456
services:
  dovecot:
    image: ${DOVECOTMESH_IMAGE:-ghcr.io/fragtion/dovecotmesh:latest}
    container_name: dovecot
    # starts with Docker at boot; no systemd unit needed
    restart: unless-stopped
    # Listeners bind on the host as before (IMAP, POP3, LMTP and SASL for
    # Postfix on 127.0.0.1, doveadm and mesh HTTP for the other nodes), and
    # the container has the host's hostname, which names the node.
    network_mode: host
    environment:
      # Refuse to start while a Maildir still has the Syncthing setup's
      # new -> cur symlink (see docker/README.md); unset to skip the check.
      MAILDIR_SYMLINK_CHECK: /home/vmail
    volumes:
      # dovecot.conf, mesh.conf, passwd and users. Also reachable as
      # /usr/local/apps/dovecot/etc/dovecot inside the container.
      - /etc/dovecot:/etc/dovecot
      # Mail, indexes and Sieve scripts
      - /home/vmail:/home/vmail
      # Mesh state (the pair states between nodes): keep it
      - ./data:/var/lib/dovecot
      # log_path and info_log_path files
      - /var/log:/var/log
      - /etc/letsencrypt:/etc/letsencrypt:ro
    stop_grace_period: 30s
