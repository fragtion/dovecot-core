<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dovecot Mesh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='3' cy='8' r='2.2' fill='%233b82f6'/%3E%3Ccircle cx='13' cy='3.5' r='2.2' fill='%233b82f6'/%3E%3Ccircle cx='13' cy='12.5' r='2.2' fill='%233b82f6'/%3E%3Cpath d='M3 8L13 3.5L13 12.5Z' fill='none' stroke='%233b82f6' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="mesh.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="2.2"/><circle cx="13" cy="3.5" r="2.2"/><circle cx="13" cy="12.5" r="2.2"/><path d="M3 8L13 3.5L13 12.5Z"/></svg>
    <span>Dovecot Mesh</span>
  </div>
  <div class="node" id="node-info">Connecting…</div>
  <div class="refresh"><span class="dot" id="live-dot"></span><span id="refreshed">–</span></div>
</header>

<div class="banner" id="banner" hidden></div>

<main>
  <section class="tiles" id="tiles"></section>

  <section class="card">
    <div class="card-head">
      <h2>Nodes</h2>
      <span class="hint">Heartbeats and sessions as seen from this node</span>
    </div>
    <div class="scroll"><table id="nodes"></table></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Users</h2>
      <div class="controls">
        <input type="search" id="user-q" placeholder="Filter users" autocomplete="off" spellcheck="false">
        <label class="toggle"><input type="checkbox" id="user-problems"> Needs attention only</label>
      </div>
    </div>
    <div class="scroll"><table id="users"></table></div>
    <div class="foot" id="users-foot"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Recent sessions</h2>
      <span class="hint">Sessions this node started, newest first</span>
    </div>
    <div class="scroll tall"><table id="activity"></table></div>
  </section>
</main>

<dialog id="verify-dialog">
  <div class="dialog-head">
    <h2 id="verify-title">Verify</h2>
    <button type="button" id="verify-close" aria-label="Close">Close</button>
  </div>
  <div id="verify-body" class="dialog-body"></div>
</dialog>

<div class="toast" id="toast" hidden></div>
<script src="mesh.js"></script>
</body>
</html>
